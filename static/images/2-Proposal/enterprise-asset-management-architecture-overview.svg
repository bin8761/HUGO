<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Asset Management Architecture Overview</title>
  <desc id="desc">Frontend on Amplify, backend on Elastic Beanstalk behind an Application Load Balancer, and supporting AWS services for data, email, secrets, logs, audit, and operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .label { font: 600 24px Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 400 18px Arial, sans-serif; fill: #cbd5e1; }
      .micro { font: 400 16px Arial, sans-serif; fill: #94a3b8; }
      .box { fill: url(#panel); stroke: #334155; stroke-width: 2; rx: 20; ry: 20; }
      .accent { fill: #38bdf8; }
      .accent2 { fill: #f59e0b; }
      .accent3 { fill: #22c55e; }
      .accent4 { fill: #a78bfa; }
      .accent5 { fill: #fb7185; }
      .line { stroke: #94a3b8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 10 10; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="80" class="label">Enterprise Asset Management - AWS Architecture Overview</text>
  <text x="80" y="114" class="micro">React + Vite on Amplify, Node.js + Express on Elastic Beanstalk, MySQL via Prisma, and operational AWS services</text>

  <rect x="80" y="170" width="260" height="170" class="box"/>
  <circle cx="125" cy="225" r="12" class="accent"/>
  <text x="155" y="232" class="label">Frontend</text>
  <text x="110" y="270" class="small">AWS Amplify Hosting</text>
  <text x="110" y="302" class="micro">React + Vite static app</text>

  <rect x="390" y="170" width="260" height="170" class="box"/>
  <circle cx="435" cy="225" r="12" class="accent2"/>
  <text x="465" y="232" class="label">Entry Point</text>
  <text x="420" y="270" class="small">Application Load Balancer</text>
  <text x="420" y="302" class="micro">Routes API requests to backend</text>

  <rect x="700" y="140" width="330" height="230" class="box"/>
  <circle cx="745" cy="195" r="12" class="accent3"/>
  <text x="775" y="202" class="label">Backend</text>
  <text x="740" y="246" class="small">AWS Elastic Beanstalk</text>
  <text x="740" y="280" class="micro">Node.js + Express</text>
  <text x="740" y="312" class="micro">Business rules, auth, validation</text>
  <text x="740" y="344" class="micro">JWT, assets, workflows, reports</text>

  <rect x="1110" y="170" width="340" height="170" class="box"/>
  <circle cx="1155" cy="225" r="12" class="accent4"/>
  <text x="1185" y="232" class="label">Data Layer</text>
  <text x="1140" y="270" class="small">Amazon RDS for MySQL</text>
  <text x="1140" y="302" class="micro">Prisma-managed relational data</text>

  <line x1="340" y1="255" x2="390" y2="255" class="line"/>
  <line x1="650" y1="255" x2="700" y2="255" class="line"/>
  <line x1="1030" y1="255" x2="1110" y2="255" class="line"/>

  <rect x="190" y="430" width="250" height="150" class="box"/>
  <circle cx="235" cy="485" r="10" class="accent5"/>
  <text x="260" y="492" class="small">Amazon S3 private bucket</text>
  <text x="220" y="528" class="micro">Attachments, images, exports</text>

  <rect x="490" y="430" width="250" height="150" class="box"/>
  <circle cx="535" cy="485" r="10" class="accent"/>
  <text x="560" y="492" class="small">Amazon SES</text>
  <text x="520" y="528" class="micro">OTP and notification email</text>

  <rect x="790" y="430" width="250" height="150" class="box"/>
  <circle cx="835" cy="485" r="10" class="accent2"/>
  <text x="860" y="492" class="small">Secrets and Config</text>
  <text x="820" y="528" class="micro">Secrets Manager + Parameter Store</text>

  <rect x="1090" y="430" width="340" height="150" class="box"/>
  <circle cx="1135" cy="485" r="10" class="accent3"/>
  <text x="1160" y="492" class="small">Ops, Logs, Audit</text>
  <text x="1120" y="528" class="micro">CloudWatch, CloudTrail, Session Manager</text>

  <line x1="860" y1="370" x2="315" y2="430" class="line dashed"/>
  <line x1="865" y1="370" x2="615" y2="430" class="line dashed"/>
  <line x1="865" y1="370" x2="915" y2="430" class="line dashed"/>
  <line x1="865" y1="370" x2="1260" y2="430" class="line dashed"/>

  <text x="80" y="660" class="label">Key Flow</text>
  <text x="80" y="700" class="small">User -> Amplify -> ALB -> Elastic Beanstalk -> RDS / S3 / SES / Secrets Manager / Parameter Store / CloudWatch</text>
  <text x="80" y="736" class="micro">CloudTrail captures audit events and Session Manager handles secure administration.</text>
</svg>
