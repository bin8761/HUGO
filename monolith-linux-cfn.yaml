  DBinstanceA5CF359B:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '5'
      AutoMinorVersionUpgrade: false
      BackupRetentionPeriod: 3
      CopyTagsToSnapshot: true
      DBName: travelbuddy
      DBSubnetGroupName:
        Ref: DBinstanceSubnetGroupA78F1F9F
      DeletionProtection: false
      Engine: mysql
      MasterUsername: root
      MasterUserPassword: labpassword
      MultiAZ: false
      Port: '3306'
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp2
      VPCSecurityGroups:
        - Fn::GetAtt:
            - DevAxNetworkSGF6BD3961
            - GroupId
    UpdateReplacePolicy: Snapshot

  AWSStudent3111CB37:
    Type: AWS::IAM::User
    Properties:
      UserName: awsstudent

  DevAxLinuxHost:
    Type: AWS::EC2::Instance
    DependsOn:
      - DBinstanceA5CF359B
    Properties:
      ImageId:
        Ref: LatestAMI
      InstanceType: m5.xlarge
      KeyName:
        Ref: EEKeyPair
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - Fn::GetAtt:
                - DevAxLinuxSecurityGroup
                - GroupId
          SubnetId:
            Ref: DevAxNetworkVPCpublicSubnet1Subnet18336BFA
      SourceDestCheck: true
      Tags:
        - Key: Name
          Value: DevAxLinuxHost
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail

            dnf update -y
            dnf install -y git java-17-amazon-corretto maven mysql awscli python3-pip unzip
            pip3 install --upgrade awsebcli

            cat >/tmp/DB.sql <<'SQL'
            use travelbuddy;

            DROP TABLE IF EXISTS `flightspecial`;
            CREATE TABLE `flightspecial` (
              `id` int(11) unsigned NOT NULL AUTO_INCREMENT,
              `header` varchar(255) NOT NULL DEFAULT '',
              `body` varchar(255) DEFAULT NULL,
              `origin` varchar(255) DEFAULT NULL,
              `originCode` varchar(6) DEFAULT NULL,
              `destination` varchar(255) DEFAULT NULL,
              `destinationCode` varchar(6) DEFAULT NULL,
              `cost` int(11) NOT NULL,
              `expiryDate` bigint(16) NOT NULL,
              PRIMARY KEY (`id`)
            ) ENGINE=InnoDB AUTO_INCREMENT=1 DEFAULT CHARSET=utf8;

            INSERT INTO `flightspecial` (`expiryDate`, `cost`, `header`, `body`, `origin`, `originCode`, `destination`, `destinationCode`) VALUES ((SELECT (UNIX_TIMESTAMP() * 1000)) + 79200 + (RAND() * 20000000),(50 + RAND() * 200),'London to Prague','Jewel of the East','London','LHR','Paris','CDG');
            INSERT INTO `flightspecial` (`expiryDate`, `cost`, `header`, `body`, `origin`, `originCode`, `destination`, `destinationCode`) VALUES ((SELECT (UNIX_TIMESTAMP() * 1000)) + 79200 + (RAND() * 20000000),(50 + RAND() * 500),'New York to London','Trans-Atlantic','Origin','ORG','Destination','DST');

            DROP TABLE IF EXISTS `hotelspecial`;
            CREATE TABLE `hotelspecial` (
              `id` int(11) unsigned NOT NULL AUTO_INCREMENT,
              `hotel` varchar(255) NOT NULL DEFAULT '',
              `description` varchar(255) DEFAULT NULL,
              `location` varchar(255) DEFAULT NULL,
              `cost` int(11) NOT NULL,
              `expiryDate` bigint(16) NOT NULL,
              PRIMARY KEY (`id`)
            ) ENGINE=InnoDB AUTO_INCREMENT=1 DEFAULT CHARSET=utf8;

            INSERT INTO `hotelspecial` (`expiryDate`, `cost`, `hotel`, `description`, `location`) VALUES ((SELECT (UNIX_TIMESTAMP() * 1000)) + 79200 + (RAND() * 20000000),(50 + RAND() * 1000),'Sommerset Hotel','Minimum stay 3 nights','Sydney');
            INSERT INTO `hotelspecial` (`expiryDate`, `cost`, `hotel`, `description`, `location`) VALUES ((SELECT (UNIX_TIMESTAMP() * 1000)) + 79200 + (RAND() * 20000000),(50 + RAND() * 1000),'EasyStay Apartments','Minimum stay one week','Melbourne');
            SQL

            mysql -h ${DBinstanceA5CF359B.Endpoint.Address} -u root -plabpassword < /tmp/DB.sql

  CreateGitCredsFunction9D6697C5:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def lambda_handler(event, context):
              print(event)
              response = {}
              try:
                  if event['RequestType'] == 'Delete':
                      iam = boto3.client('iam')
                      credentials = iam.list_service_specific_credentials(UserName='awsstudent', ServiceName='codecommit.amazonaws.com')
                      if credentials['ServiceSpecificCredentials']:
                          service_specific_credential_id = credentials['ServiceSpecificCredentials'][0]['ServiceSpecificCredentialId']
                          iam.delete_service_specific_credential(UserName='awsstudent', ServiceSpecificCredentialId=service_specific_credential_id)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, response)
                  else:
                      iam = boto3.client('iam')
                      gitcreds = iam.create_service_specific_credential(UserName='awsstudent', ServiceName='codecommit.amazonaws.com')
                      response['GitUserName'] = gitcreds['ServiceSpecificCredential']['ServiceUserName']
                      response['GitPassword'] = gitcreds['ServiceSpecificCredential']['ServicePassword']
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, response)
              except Exception as e:
                  print(e)
                  response['Status'] = 'FAILED'
                  response['Reason'] = 'Git failed, see log for details'
                  cfnresponse.send(event, context, cfnresponse.FAILED, response)
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
          - CreateGitCredsRole385E94AC
          - Arn
      Runtime: python3.9
      FunctionName: CreateGitCredsFunction
      MemorySize: 128
      Timeout: 90
    DependsOn:
      - CreateGitCredsRole385E94AC

  GitCredsCR:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - CreateGitCredsFunction9D6697C5
          - Arn
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

Outputs:
  GitUserName:
    Description: Git Username
    Value:
      Fn::GetAtt:
        - GitCredsCR
        - GitUserName
  GitPassword:
    Description: Git Password
    Value:
      Fn::GetAtt:
        - GitCredsCR
        - GitPassword
  RDSEndpoint:
    Description: RDS database endpoint
    Value:
      Fn::GetAtt:
        - DBinstanceA5CF359B
        - Endpoint.Address
